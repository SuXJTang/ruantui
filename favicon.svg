<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="fBg" cx="45%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1e2a4d"/>
      <stop offset="100%" stop-color="#080d18"/>
    </radialGradient>
    <radialGradient id="fBall" cx="34%" cy="28%" r="78%">
      <stop offset="0%" stop-color="#a5e9ff"/>
      <stop offset="35%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#312e81"/>
    </radialGradient>
    <linearGradient id="fRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="fGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#fBg)"/>

  <!-- 球体：占比大，颜色亮 -->
  <circle cx="32" cy="32" r="19" fill="url(#fBall)"/>

  <!-- 简化经纬线：只留 2 条，比原来粗 -->
  <g clip-path="url(#fClip)" stroke="#bae6fd" fill="none" stroke-width="1.1" opacity="0.5">
    <ellipse cx="32" cy="32" rx="19" ry="7"/>
    <ellipse cx="32" cy="32" rx="7" ry="19"/>
  </g>
  <clipPath id="fClip"><circle cx="32" cy="32" r="19"/></clipPath>

  <!-- 高光 -->
  <ellipse cx="25" cy="24" rx="8" ry="5" fill="#fff" opacity="0.35"
           transform="rotate(-28 25 24)"/>

  <!-- 轨道环：粗，亮，清晰可见 -->
  <g filter="url(#fGlow)" fill="none">
    <ellipse cx="32" cy="32" rx="30" ry="9"
             stroke="url(#fRing)" stroke-width="2.8"
             transform="rotate(-28 32 32)"/>
    <ellipse cx="32" cy="32" rx="26" ry="7.5"
             stroke="#c4b5fd" stroke-width="2"
             transform="rotate(48 32 32)" opacity="0.85"/>
  </g>

  <!-- 两个光点：大一点，16px 下能看见 -->
  <circle cx="59" cy="22" r="2.8" fill="#a5f3fc" filter="url(#fGlow)"/>
  <circle cx="6" cy="43" r="2.4" fill="#c4b5fd" filter="url(#fGlow)"/>
</svg>