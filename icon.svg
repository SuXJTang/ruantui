<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 240 240">
  <defs>
    <radialGradient id="gN-bg" cx="42%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a2340"/>
      <stop offset="60%" stop-color="#0b1019"/>
      <stop offset="100%" stop-color="#04060b"/>
    </radialGradient>
    <radialGradient id="gN-ball" cx="36%" cy="30%" r="72%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="40%" stop-color="#3b82f6"/>
      <stop offset="78%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </radialGradient>
    <linearGradient id="gN-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <clipPath id="gN-clip"><circle cx="120" cy="120" r="54"/></clipPath>
    <filter id="gN-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gN-glowSoft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="240" height="240" rx="56" fill="url(#gN-bg)"/>
  <!-- 背景星点 -->
  <g fill="#a5f3fc" opacity="0.5">
    <circle cx="42" cy="58" r="1.3"/><circle cx="196" cy="72" r="1.1"/>
    <circle cx="58" cy="188" r="1.4"/><circle cx="188" cy="176" r="1.2"/>
    <circle cx="36" cy="126" r="1"/><circle cx="204" cy="128" r="1.3"/>
    <circle cx="86" cy="40" r="1.1"/><circle cx="158" cy="202" r="1"/>
  </g>
  <!-- 球体外发光 -->
  <circle cx="120" cy="120" r="62" fill="#3b82f6" opacity="0.22" filter="url(#gN-glowSoft)"/>
  <circle cx="120" cy="120" r="54" fill="url(#gN-ball)"/>
  <g clip-path="url(#gN-clip)" stroke="#bae6fd" fill="none" opacity="0.4">
    <g stroke-width="1">
      <ellipse cx="120" cy="120" rx="54" ry="18"/>
      <ellipse cx="120" cy="120" rx="54" ry="36"/>
      <ellipse cx="120" cy="120" rx="18" ry="54"/>
      <ellipse cx="120" cy="120" rx="36" ry="54"/>
      <circle cx="120" cy="120" r="54"/>
    </g>
  </g>
  <ellipse cx="98" cy="94" rx="24" ry="16" fill="#fff" opacity="0.22"
           transform="rotate(-28 98 94)"/>
  <g filter="url(#gN-glow)" fill="none" transform="rotate(-24 120 120)">
    <g>
      <ellipse cx="120" cy="120" rx="94" ry="30"
               stroke="url(#gN-ring)" stroke-width="2.4" opacity="0.9"
               stroke-dasharray="150 40"/>
      <ellipse cx="120" cy="120" rx="94" ry="30"
               stroke="#67e8f9" stroke-width="1" opacity="0.35"/>
    </g>
  </g>
  <g filter="url(#gN-glow)" fill="none" transform="rotate(52 120 120)">
    <g>
      <ellipse cx="120" cy="120" rx="86" ry="22"
               stroke="#a78bfa" stroke-width="1.6" opacity="0.55"
               stroke-dasharray="90 60"/>
    </g>
  </g>
  <g filter="url(#gN-glow)">
    <circle cx="200" cy="86" r="4" fill="#a5f3fc"/>
    <circle cx="42" cy="152" r="3" fill="#c4b5fd"/>
    <circle cx="168" cy="196" r="2.6" fill="#67e8f9"/>
  </g>
  <g stroke="#22d3ee" stroke-width="1.6" opacity="0.42" stroke-linecap="round">
    <path d="M44 70 V52 H62"/>
    <path d="M178 52 H196 V70"/>
    <path d="M196 170 V188 H178"/>
    <path d="M62 188 H44 V170"/>
  </g></svg>